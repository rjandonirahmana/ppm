name: Rust Docker CI/CD
on:
  push:
    branches: ["main"]
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ppm:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ppm:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # ── DEPLOY: SALIN LALU JALANKAN BERKAS MILIK SERVER ──────────────────
      #
      # Seluruh perintah `docker run` — port, volume, dan SEMUA env rahasia —
      # tinggal di berkas milik server (`/opt/ppm/deploy.txt`). Repo ini tak
      # pernah memuatnya, jadi tak ada rahasia yang ikut ter-push ke GitHub
      # maupun melintas di log CI. Yang dikirim workflow cuma satu hal: TAG
      # IMAGE yang barusan dibangun.
      #
      # Sebelumnya langkah ini hanya `docker pull` — image baru terunduh lalu
      # DIDIAMKAN, dan container lama terus berjalan dengan image lama. Deploy
      # dilaporkan hijau sementara server tak berubah sama sekali.
      #
      # Kenapa DISALIN dulu, bukan dijalankan langsung: `bash berkas` membaca
      # berkasnya sambil menjalankan. Kalau berkas aslinya disunting saat
      # deploy berjalan, bash melanjutkan dari OFFSET BYTE yang sama di isi
      # yang sudah berubah — perintah bisa terpotong di tengah dan berjalan
      # separuh. Salinan bertanggal membuat tiap deploy memakai satu isi yang
      # membeku, dan salinan itu tertinggal sebagai jejak apa yang benar-benar
      # dijalankan.
      #
      # Tag memakai SHA commit, bukan `latest`: dua push beruntun bisa membuat
      # `latest` di server menunjuk build yang BERBEDA dari yang barusan
      # dibangun, dan tak ada cara mengetahuinya setelah kejadian.
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          # `script_stop` + `set -e`: tanpa keduanya, satu perintah yang gagal
          # di tengah tetap berakhir dengan status 0 dan deploy dilaporkan
          # BERHASIL padahal containernya tak pernah naik.
          script_stop: true
          script: |
            set -euo pipefail

            SUMBER=/opt/ppm/deploy.txt
            SALINAN=/opt/ppm/riwayat/deploy-$(date +%Y%m%d-%H%M%S)-${{ github.sha }}.sh

            # Berkasnya HARUS sudah ada. Tanpa penjagaan ini, deploy pada server
            # yang belum disiapkan gagal dengan "No such file" dari bash — pesan
            # yang tak memberi tahu apa yang harus dibuat.
            if [ ! -f "$SUMBER" ]; then
              echo "ERROR: $SUMBER tidak ada di server."
              echo "Buat berkas itu (berisi perintah docker run + env), lalu ulangi deploy."
              exit 1
            fi

            mkdir -p /opt/ppm/riwayat
            cp "$SUMBER" "$SALINAN"
            chmod 700 "$SALINAN"

            # Tag dikirim DUA cara supaya berkas server bebas memakai yang mana
            # pun: sebagai argumen ($1) dan sebagai variabel lingkungan.
            export PPM_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/ppm:${{ github.sha }}"
            echo "→ Menjalankan $SALINAN dengan image $PPM_IMAGE"
            bash "$SALINAN" "$PPM_IMAGE"

            # Simpan 10 salinan terakhir; sisanya dibuang supaya folder riwayat
            # tak tumbuh tanpa batas.
            ls -1t /opt/ppm/riwayat/deploy-*.sh 2>/dev/null | tail -n +11 | xargs -r rm -f
