name: Rust Docker CI/CD
on:
  push:
    branches: ["main"]
jobs:
  # Uji dijalankan SEBELUM build & deploy, dan deploy bergantung padanya.
  # Sebelumnya workflow ini langsung membangun image lalu mendorongnya ke
  # server produksi tanpa satu pun `cargo test` — seluruh berkas di tests/
  # tak pernah berjalan di mana pun kecuali di mesin yang kebetulan
  # mengingatnya. Papan hijau di sini dulu hanya berarti "image berhasil
  # dibuat", bukan "kodenya benar".
  test:
    runs-on: ubuntu-latest
    services:
      # live_audio membentuk ConnectionManager Redis saat setup (tidak lazy),
      # jadi tanpa service ini ujinya tak bisa berjalan — dan sejak sekarang ia
      # PANIK bila absen di CI alih-alih diam-diam dilaporkan lulus.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # Samakan dengan rust-toolchain.toml.
          toolchain: nightly-2026-07-15
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --locked: bangun dengan Cargo.lock APA ADANYA. Tanpa ini cargo boleh
      # memutakhirkan dependensi diam-diam, sehingga yang diuji di sini bukan
      # yang akan dijalankan di produksi.
      # --all-targets: ikutkan tests/ dan benches/. Berkas uji di repo ini
      # pernah gagal DIKOMPILASI berbulan-bulan tanpa ada yang tahu, karena
      # `cargo test` biasa tak menyentuh target yang tak dipanggil.
      # --no-fail-fast: laporkan SEMUA kegagalan sekali jalan, bukan berhenti
      # di yang pertama lalu menyembunyikan sisanya.
      # CARGO_INCREMENTAL=0: build CI selalu dingin, jadi inkremental tak
      # menghemat apa pun — tapi ia BISA merugikan. Artefak inkremental basi di
      # proyek ini menghasilkan kegagalan link `undefined symbol: anon.<hash>.llvm`
      # yang lolos `cargo check` (lihat catatan di [profile.dev] Cargo.toml).
      # Di CI hal itu akan tampil sebagai kegagalan misterius yang tak bisa
      # direproduksi siapa pun.
      - name: Uji
        env:
          CARGO_INCREMENTAL: "0"
          # Menyatakan: service Redis di atas MEMANG tersedia. Uji live_audio
          # memakainya untuk membedakan "Redis tak ada, lewati" (mesin
          # pengembang) dari "Redis dijanjikan tapi mati" (kegagalan nyata).
          PPM_REQUIRE_REDIS: "1"
        run: cargo test --locked --all-targets --no-fail-fast --no-default-features --features ssr
      # Clippy INFORMATIF, bukan penghalang. Kodebase ini punya ±47 lint yang
      # sudah ada sejak lama (argumen fungsi >7, `from_str` bukan trait,
      # indentasi doc-list) — semuanya soal gaya, bukan kebenaran. Memasang
      # `-D warnings` sekarang berarti setiap deploy produksi terhenti oleh
      # hal-hal itu, dan yang akan terjadi bukan lint-nya dibereskan melainkan
      # langkah ini dimatikan. Naikkan jadi `-D warnings` setelah lint yang ada
      # dibersihkan — saat itu ia baru bermakna.
      - name: Clippy (tak menghalangi)
        continue-on-error: true
        run: cargo clippy --locked --all-targets --no-default-features --features ssr

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ppm:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ppm:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ppm:latest
