# ═══════════════════════════════════════════════════════════════════════════════
# ppm — Absensi Santri PPM AFM. Satu crate: SSR (Axum) + Hydrate (WASM).
# Leptos SSR: render cepat & hemat memori. Data di Postgres (lihat migration/).
# ═══════════════════════════════════════════════════════════════════════════════

[package]
name = "ppm"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ppm"
path = "src/main.rs"

[lib]
name = "ppm"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[package.metadata.leptos]
output-name = "ppm"
site-root = "target/site"
site-pkg-dir = "pkg"
# Tailwind di-compile cargo-leptos (unduh binary standalone otomatis) →
# /pkg/ppm.css. Menggantikan Play CDN. Config & purge di tailwind.config.js.
tailwind-input-file = "style/tailwind.css"
assets-dir = "public"
site-addr = "0.0.0.0:3000"
reload-port = 3001
browserquery = "defaults"
# Nama file /pkg (wasm/js/css) ber-hash per build → aman di-cache browser
# selamanya (immutable): build baru = nama baru, tak pernah collide dgn cache
# lama. Lihat main.rs (Cache-Control) & app.rs (HashedStylesheet/HydrationScripts).
hash-files = true
bin-features = ["ssr"]
lib-features = ["hydrate"]
lib-profile-release = "wasm-release"

[features]
default = ["ssr"]
ssr = [
    "leptos/ssr",
    "leptos/nonce",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:leptos_axum",
]
hydrate = ["leptos/hydrate", "leptos/nonce"]

# ── Shared deps (SEMUA target: native SSR + WASM) ──────────────────────────────
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }

leptos = { version = "0.8", default-features = false }
leptos_meta = { version = "0.8", default-features = false }
leptos_router = { version = "0.8", default-features = false }
leptos_axum = { version = "0.8", optional = true }

wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Document",
    "Element",
    "HtmlElement",
    "Storage",
    "Event",
    "MouseEvent",
    # Siaran suara sesi (web/live_audio_ui.rs): mic → MediaRecorder (guru),
    # MediaSource playback (santri).
    "Navigator",
    "MediaDevices",
    "MediaStream",
    "MediaStreamTrack",
    "MediaStreamConstraints",
    "MediaRecorder",
    "MediaRecorderOptions",
    "BlobEvent",
    "Blob",
    "MediaSource",
    "MediaSourceReadyState",
    "SourceBuffer",
    "HtmlAudioElement",
    "HtmlMediaElement",
    "TimeRanges",
    "Url",
    # SSE ruang live (pengganti polling).
    "EventSource",
    "MessageEvent",
    "FormData",
    "Request",
    "RequestInit",
    "Response",
    "HtmlInputElement",
    "FileList",
    "File",
] }

# ── Server-only deps (bukan wasm32) ────────────────────────────────────────────
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = "0.1"
# Fitur eksplisit (bukan "full"): net=TcpListener, time=interval/sleep,
# fs=finalisasi rekaman, sync/macros/rt — hasil audit Jul 2026.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "fs", "sync"] }
# BroadcastStream utk endpoint SSE ruang live.
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "compression-gzip", "compression-br", "trace", "set-header"] }

# Database
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
postgres-types = { version = "0.2", features = ["derive"] }
deadpool-postgres = "0.14"

# Auth
bcrypt = "0.15"
jsonwebtoken = "9"

# Export laporan: PDF (font base-14 bawaan PDF, TANPA file font eksternal —
# lihat service/export.rs) + Excel (.xlsx, tanpa dependensi sistem).
# default-features=false: matikan fitur "html" (default!) — itu menarik masuk
# seluruh azul-layout + rust-fontconfig (engine layout HTML) yg TAK dipakai
# sama sekali di sini (laporan = teks+tabel manual via Op::WriteText, bukan
# render HTML→PDF). Build jauh lebih ringan tanpa fitur ini.
printpdf = { version = "0.11", default-features = false }
rust_xlsxwriter = "0.96"

# Storage rekaman → RustFS (S3-compatible), pola e-ticketing/wedding-web.
aws-sdk-s3 = "1"
# aws-sdk-s3 memakai rustls; sediakan crypto provider (ring) agar tak panik.
rustls = { version = "0.23", features = ["ring"], default-features = false }

# Registrasi via link undangan + OTP WhatsApp (pola e-ticketing service/auth.rs):
# Redis = penyimpanan sementara link undangan (24 jam) & pending registration
# (10 menit), reqwest = panggil WAHA (WhatsApp HTTP API), rand = generate
# OTP 6-digit & password acak. Server-only — tak pernah dipakai di wasm.
redis = { version = "1.2.1", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13", features = ["json"] }
rand = "0.10.2"

# Config / Logging
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── WASM-only deps ─────────────────────────────────────────────────────────────
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
# Klien siaran suara + SSE (pola dari e-ticketing live_stream.rs).
send_wrapper = "0.6"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
gloo-net = { version = "0.7", features = ["http"] }
gloo-timers = { version = "0.4", features = ["futures"] }

# ── Dev deps (integration test tests/live_audio.rs) ───────────────────────────
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# ── Profiles ────────────────────────────────────────────────────────────────────
[profile.dev]
opt-level = 1
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
# panic=abort HANYA di bundle WASM → buang kode unwinding = .wasm lebih kecil.
# Di WASM panic memang selalu abort (nol perubahan perilaku). SENGAJA TIDAK di
# [profile.release] server: di sana panic=abort mematikan SELURUH proses (hilang
# isolasi panic per-request) → risiko ketersediaan.
panic = "abort"
