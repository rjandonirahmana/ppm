# ═══════════════════════════════════════════════════════════════════════════════
# ppm — Absensi Santri AFM SMART. Satu crate: SSR (Axum) + Hydrate (WASM).
# Leptos SSR: render cepat & hemat memori. Data di Postgres (lihat migration/).
# ═══════════════════════════════════════════════════════════════════════════════

[package]
name = "ppm"
version = "0.1.0"
# Edisi 2024 (sejak Agustus 2026, dari 2021). Migrasinya diperiksa dengan
# `cargo fix --edition`: satu-satunya perubahan yang benar-benar DIWAJIBKAN
# compiler adalah `use<>` di `web::pages::laporan::gate_status_card` (aturan
# penangkapan lifetime RPIT). Sisa saran otomatisnya sengaja TIDAK diambil —
# lihat catatan di berkas itu dan di `service::mod::bail_user`.
edition = "2024"

[[bin]]
name = "ppm"
path = "src/main.rs"

[lib]
name = "ppm"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[package.metadata.leptos]
output-name = "ppm"
site-root = "target/site"
site-pkg-dir = "pkg"
# Tailwind di-compile cargo-leptos (unduh binary standalone otomatis) →
# /pkg/ppm.css. Menggantikan Play CDN. Config & purge di tailwind.config.js.
tailwind-input-file = "style/tailwind.css"
assets-dir = "public"
site-addr = "0.0.0.0:3000"
reload-port = 3001
browserquery = "defaults"
# hash-files DIMATIKAN (Jul 2026). Dgn true, Leptos runtime membaca `hash.txt`
# dari FOLDER BINARI (current_exe().parent()/hash.txt) — cargo-leptos menaruhnya
# di site-root, jadi tiap deploy (Docker/manual) HARUS menyalin hash.txt ke sebelah
# binari, kalau tidak → panic "failed to read hash file" tiap request. Footgun
# berulang. false = nama file /pkg TETAP (ppm.js/wasm/css), tanpa hash.txt.
# Konsekuensi: cache /pkg TIDAK boleh immutable → main.rs pakai no-cache,
# must-revalidate (browser 304, ambil baru setelah deploy).
hash-files = false
bin-features = ["ssr"]
lib-features = ["hydrate"]
lib-profile-release = "wasm-release"
# Profil WASM untuk `cargo leptos watch`. Tanpa baris ini, bundel dev memakai
# `[profile.dev]` apa adanya — termasuk `debug = 1`, yang pada aplikasi Leptos
# sebesar ini menghasilkan .wasm ±22 MB. Ukuran itu bukan sekadar lambat: selama
# peramban masih mengunduh dan meng-compile-nya, halaman sudah tampil (HTML SSR)
# tapi BELUM terhidrasi — dan router Leptos yang belum terpasang membuat klik
# tak menghasilkan apa pun. Itulah "kadang tak bisa diklik / tak bisa pindah
# halaman" yang muncul hilang-timbul: yang menentukan hanya seberapa cepat
# seseorang mengklik setelah halaman terlihat.
lib-profile-dev = "wasm-dev"

[features]
default = ["ssr"]
ssr = [
    "leptos/ssr",
    "leptos/nonce",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:leptos_axum",
]
hydrate = ["leptos/hydrate", "leptos/nonce"]

# ── Shared deps (SEMUA target: native SSR + WASM) ──────────────────────────────
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }

leptos = { version = "0.8", default-features = false }
leptos_meta = { version = "0.8", default-features = false }
leptos_router = { version = "0.8", default-features = false }
leptos_axum = { version = "0.8", optional = true }

wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Document",
    "Element",
    "HtmlElement",
    "Storage",
    "Event",
    "MouseEvent",
    # Siaran suara sesi (web/live_audio_ui.rs): mic → MediaRecorder (guru),
    # MediaSource playback (santri).
    "Navigator",
    "Clipboard",
    "MediaDevices",
    "MediaStream",
    "MediaStreamTrack",
    "MediaStreamConstraints",
    "MediaRecorder",
    "MediaRecorderOptions",
    "BlobEvent",
    "Blob",
    "MediaSource",
    "MediaSourceReadyState",
    "SourceBuffer",
    "HtmlAudioElement",
    "HtmlMediaElement",
    "TimeRanges",
    "Url",
    # SSE ruang live (pengganti polling).
    "EventSource",
    "MessageEvent",
    "FormData",
    "Request",
    "RequestInit",
    "Response",
    "HtmlInputElement",
    "FileList",
    "File",
    # Editor titik fokus galeri (pages/galeri.rs): seret foto di dalam bingkai.
    # PointerEvent menyatukan tetikus/sentuh/pena dalam satu jalur kode;
    # DomRect + HtmlImageElement dipakai menghitung seberapa jauh foto masih
    # bisa digeser (ukuran bingkai vs ukuran asli foto).
    "PointerEvent",
    "DomRect",
    "HtmlImageElement",
    # Focus trap Sheet (web/components.rs): query_selector_all → NodeList.
    "NodeList",
    # Gulir-tak-berujung daftar santri (pages/students.rs): sentinel di dasar
    # daftar diamati IntersectionObserver. Dipilih ketimbang listener `scroll`
    # karena tak perlu di-throttle sendiri dan tak ikut jalan saat halaman diam.
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
] }

# ── Server-only deps (bukan wasm32) ────────────────────────────────────────────
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = "0.1"
# Fitur eksplisit (bukan "full"): net=TcpListener, time=interval/sleep,
# fs=finalisasi rekaman, sync/macros/rt — hasil audit Jul 2026.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "fs",
    "sync",
    # SIGTERM/Ctrl-C untuk graceful shutdown (lihat `sinyal_berhenti` di main.rs).
    "signal",
] }
# BroadcastStream utk endpoint SSE ruang live.
tokio-stream = { version = "0.1", features = ["sync"] }
# ReaderStream: unduh rekaman DI-STREAM dari disk (dulu std::fs::read → seluruh
# file masuk RAM; rekaman ceramah 1–2 jam bisa puluhan MB, beberapa unduhan
# bersamaan cukup untuk menghabiskan RAM VPS 4GB). Sudah ada di pohon dependensi
# (dipakai axum), jadi tak menambah waktu build.
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.7", features = [
    "fs",
    "compression-gzip",
    "compression-br",
    "trace",
    "set-header",
] }

# Database
tokio-postgres = { version = "0.7", features = [
    "with-chrono-0_4",
    "with-serde_json-1",
] }
postgres-types = { version = "0.2", features = ["derive"] }
deadpool-postgres = "0.14"

# Auth
bcrypt = "0.19"
# SHA-256 utk kunci perangkat RFID: butuh hash CEPAT (dipanggil tiap tap kartu),
# jadi BUKAN bcrypt yang sengaja lambat. Lihat service/admin.rs::hash_api_key.
sha2 = "0.11"
# `rust_crypto` WAJIB DITULIS. Sejak versi 11, jsonwebtoken tak lagi membawa
# backend kripto sendiri: default-nya cuma `use_pem`, dan penyedia kripto harus
# dipilih lewat fitur. Tanpa itu ia tetap COMPILE dengan mulus lalu PANIC pada
# `encode()` pertama — artinya kegagalannya baru muncul saat orang pertama
# menekan tombol Masuk ("Could not automatically determine the process-level
# CryptoProvider"), sebagai 500 dari server fn login, bukan sebagai galat build.
#
# Dipilih `rust_crypto` (murni Rust), BUKAN `aws_lc_rs`: yang terakhir mengikat
# build ke cmake + toolchain C, dan image Docker proyek ini sengaja dijaga tak
# butuh keduanya. Token di sini HS256 (lihat src/auth.rs) — hmac+sha2 sudah
# cukup; sisa algoritma yang ikut terbawa fitur ini tak dipakai.
jsonwebtoken = { version = "11", features = ["rust_crypto"] }

# Export laporan: PDF (font base-14 bawaan PDF, TANPA file font eksternal —
# lihat service/export.rs) + Excel (.xlsx, tanpa dependensi sistem).
# default-features=false: matikan fitur "html" (default!) — itu menarik masuk
# seluruh azul-layout + rust-fontconfig (engine layout HTML) yg TAK dipakai
# sama sekali di sini (laporan = teks+tabel manual via Op::WriteText, bukan
# render HTML→PDF). Build jauh lebih ringan tanpa fitur ini.
printpdf = { version = "0.12", default-features = false }
rust_xlsxwriter = "0.98"

# Storage rekaman → RustFS (S3-compatible), pola e-ticketing/wedding-web.
aws-sdk-s3 = "1"
# aws-sdk-s3 memakai rustls; sediakan crypto provider (ring) agar tak panik.
rustls = { version = "0.23", features = ["ring"], default-features = false }

# Registrasi via link undangan + OTP WhatsApp (pola e-ticketing service/auth.rs):
# Redis = penyimpanan sementara link undangan (24 jam) & pending registration
# (10 menit), reqwest = panggil WAHA (WhatsApp HTTP API), rand = generate
# OTP 6-digit & password acak. Server-only — tak pernah dipakai di wasm.
redis = { version = "1.2.1", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13", features = ["json"] }
rand = "0.10.2"
# HANYA untuk `statvfs` — sisa ruang disk di /status-server. Tak ada cara
# membaca ruang kosong lewat /proc (isinya daftar mount, bukan kapasitas), dan
# memanggil `df` berarti menjalankan proses tiap halaman dibuka + bergantung
# pada base image yang menyertakan coreutils. libc SUDAH ada di graf dependensi
# (lewat tokio, rustls, dll), jadi menjadikannya dependensi langsung menambah
# NOL waktu kompilasi — beda dengan `sysinfo` yang menyeret selusin crate baru.
libc = "0.2"

# Config / Logging
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── WASM-only deps ─────────────────────────────────────────────────────────────
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
# ⚠️ JANGAN NAIKKAN KE 0.4 — ini SAKELAR BACKEND, bukan dependensi biasa.
#
# Kode di sini tak pernah memanggil getrandom. Barisnya ada semata untuk
# menyalakan fitur `wasm_js` pada salinan getrandom yang dipakai POHON WASM:
#
#     leptos 0.8 → rand 0.9 → rand_core 0.9 → getrandom 0.3
#
# Tanpa fitur itu, getrandom 0.3 tak punya sumber acak di
# wasm32-unknown-unknown. Fiturnya HANYA ada di lini 0.3; getrandom 0.4 sama
# sekali tak memilikinya (satu-satunya fiturnya `std`) karena di sana pemilihan
# backend pindah ke cfg compiler. Menaikkan versi di sini berarti menambah
# salinan 0.4 yang tak dipakai siapa pun SEKALIGUS mematikan backend pada 0.3
# yang sebenarnya dibutuhkan — dan gejalanya baru muncul saat dijalankan.
#
# Angkanya baru boleh berubah kalau leptos sendiri pindah ke rand/getrandom
# yang lebih baru. Periksa dengan:
#     cargo tree --target wasm32-unknown-unknown --no-default-features \
#                --features hydrate -i getrandom@0.3.4
getrandom = { version = "0.3", features = ["wasm_js"] }
# Klien siaran suara + SSE (pola dari e-ticketing live_stream.rs).
send_wrapper = "0.6"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
gloo-net = { version = "0.7", features = ["http"] }
gloo-timers = { version = "0.4", features = ["futures"] }

# ── Dev deps (integration test tests/live_audio.rs) ───────────────────────────
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# ── Profiles ────────────────────────────────────────────────────────────────────
[profile.dev]
opt-level = 1
debug = 1
# ⚠️ KALAU BUILD GAGAL DI TAHAP LINK DENGAN "undefined symbol: anon.<hash>.llvm"
# (baik `rust-lld` untuk WASM maupun `cc` untuk biner server), ITU BUKAN SALAH
# KODE ANDA — itu artefak inkremental yang basi. Gejalanya khas: simbol yang
# hilang bernama `anon.…llvm.…` atau instansiasi generik Leptos, dan
# `cargo check` tetap bersih.
#
# Obatnya, dari yang paling ringan:
#     CARGO_INCREMENTAL=0 cargo leptos build
#     cargo clean -p ppm && cargo clean -p ppm --target-dir target/front
#
# `cargo leptos` memakai RUSTFLAGS berbeda dari `cargo build` biasa, jadi
# artefaknya TERPISAH — membersihkan `target/` saja tak cukup, `target/front`
# (bundle WASM) harus ikut. Ini pernah menyesatkan: `cargo build` dengan flag
# yang kelihatannya sama berhasil, sementara `cargo leptos build` terus gagal.
#
# Dibiarkan `true` karena mematikannya memperlambat SETIAP rebuild saat
# `cargo leptos watch`, sedangkan kegagalannya sesekali dan obatnya satu baris.
#
# DI CI justru sebaliknya: build di sana selalu dingin, jadi inkremental tak
# menghemat apa pun sementara artefak basi tetap bisa lolos. Workflow sudah
# menyetel CARGO_INCREMENTAL=0 — biarkan begitu.
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# Bundel WASM saat PENGEMBANGAN (dipakai `cargo leptos watch` lewat
# `lib-profile-dev` di atas).
#
# Yang dipangkas hanya INFORMASI DEBUG, bukan optimasi. Pada target wasm32
# seluruh DWARF ikut masuk ke dalam berkas .wasm yang benar-benar diunduh
# peramban — berbeda dari biner native, tempat simbol debug tak pernah dikirim
# ke mana-mana. Di aplikasi sebesar ini ia menyumbang bagian terbesar ukuran.
#
# `line-tables-only`, BUKAN `false`: panic tetap menyebut berkas dan nomor
# barisnya di konsol (lewat `console_error_panic_hook`, lihat lib.rs) — yang
# justru paling dibutuhkan saat mengembangkan. Yang hilang cuma inspeksi
# variabel di debugger, dan itu praktis tak pernah dipakai di WASM.
#
# Butuh trace lengkap sesekali? Jalankan `cargo leptos watch --wasm-debug`.
[profile.wasm-dev]
inherits = "dev"
opt-level = "s"
debug = "line-tables-only"
# Di WASM panic SELALU abort — tak ada unwinding sama sekali di sana. Jadi
# membawa tabel unwinding ke dalam bundel adalah biaya murni: kode yang tak
# mungkin dijalankan, tapi tetap diunduh dan di-compile peramban tiap kali.
# `console_error_panic_hook` (lib.rs) tetap berjalan lebih dulu, jadi pesan
# panic-nya tetap muncul di konsol.
panic = "abort"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
# panic=abort HANYA di bundle WASM → buang kode unwinding = .wasm lebih kecil.
# Di WASM panic memang selalu abort (nol perubahan perilaku). SENGAJA TIDAK di
# [profile.release] server: di sana panic=abort mematikan SELURUH proses (hilang
# isolasi panic per-request) → risiko ketersediaan.
panic = "abort"
